<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta
      name="description"
      content="Form kontak Saudi Coffee - hubungi kami untuk informasi produk dan pemesanan."
    />

    <title>Kontak - Saudi Coffee</title>

    <link rel="stylesheet" href="css/style.css" />

    <script src="js/form.js" defer></script>
  </head>

  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html" aria-label="Saudi Coffee - Beranda">
          <span class="brand-mark" aria-hidden="true">☕</span>
          <span>Saudi Coffee</span>
        </a>

        <nav aria-label="Navigasi utama">
          <a href="index.html">Beranda</a>
          <a href="tentang.html">Tentang Kami</a>
          <a href="produk.html">Produk</a>
          <a href="galeri.html">Galeri</a>
          <a href="kontak.html" aria-current="page">Kontak</a>
          <a href="index.html#profil">Profil</a>
        </nav>
      </div>
    </header>

    <main class="page">
      <h1>Kontak Saudi Coffee</h1>
      <p>
        Gunakan form ini untuk bertanya tentang produk, pesanan, atau kerja
        sama.
      </p>

      <!-- Pastikan ID form sekarang adalah "form-kontak" sesuai contoh dosen -->
      <form id="form-kontak" action="#" method="post">
        <div class="field">
          <label for="nama">Nama lengkap</label>
          <input id="nama" name="nama" type="text" required minlength="3" />
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required />
        </div>

        <div class="field">
          <label for="paket">Paket yang diminati</label>
          <select id="paket" name="paket" required>
            <option value="">Pilih paket</option>
            <option value="Arabian Qahwa">Arabian Qahwa</option>
            <option value="Saudi Dates Coffee">Saudi Dates Coffee</option>
            <option value="Paket Keluarga">Paket Keluarga</option>
          </select>
        </div>

        <fieldset>
          <legend>Topik pertanyaan</legend>
          <label
            ><input type="radio" name="topik" value="produk" required />
            Produk</label
          >
          <label
            ><input type="radio" name="topik" value="pesanan" /> Pesanan</label
          >
          <label
            ><input type="radio" name="topik" value="kerja-sama" /> Kerja
            sama</label
          >
        </fieldset>

        <div class="field">
          <label for="pesan">Pesan</label>
          <textarea
            id="pesan"
            name="pesan"
            rows="4"
            required
            minlength="10"
          ></textarea>
        </div>

        <button type="submit">Kirim Pesan</button>
      </form>

      <!-- Bagian Preview menggunakan tag <pre> sesuai instruksi dosen -->
      <section aria-labelledby="preview-title">
        <h2 id="preview-title">Preview</h2>
        <pre id="preview">Data form akan muncul di sini.</pre>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>
          &copy; 2026 Saudi Coffee. Website UMKM untuk tugas Pemrograman Web 1.
        </p>
      </div>
    </footer>
  </body>
</html>
